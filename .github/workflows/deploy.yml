name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_push_images:
    name: Test, build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ghcr_owner: ${{ steps.image_names.outputs.owner }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test backend
        run: dotnet test backend/Goulash.sln --configuration Release

      - name: Resolve image names
        id: image_names
        shell: bash
        env:
          GHCR_OWNER_INPUT: ${{ vars.GHCR_OWNER }}
        run: |
          owner_source="${GHCR_OWNER_INPUT:-$GITHUB_REPOSITORY_OWNER}"
          owner="$(echo "$owner_source" | tr '[:upper:]' '[:lower:]')"
          [[ "$owner" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/$owner/goulash2-api" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/$owner/goulash2-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image_names.outputs.api_image }}:${{ github.sha }}
            ${{ steps.image_names.outputs.api_image }}:latest
          cache-from: type=gha,scope=goulash2-api
          cache-to: type=gha,mode=max,scope=goulash2-api

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image_names.outputs.frontend_image }}:${{ github.sha }}
            ${{ steps.image_names.outputs.frontend_image }}:latest
          cache-from: type=gha,scope=goulash2-frontend
          cache-to: type=gha,mode=max,scope=goulash2-frontend

  deploy_to_server:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build_and_push_images
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$SERVER_USER"
          test -n "$DEPLOY_PATH"
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_PATH/scripts'"
          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" compose.prod.yaml "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/compose.prod.yaml"
          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" scripts/deploy.sh "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/scripts/deploy.sh"

      - name: Log in to GHCR on server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GHCR_PAT }}
        run: |
          if [ -n "$GHCR_READ_TOKEN" ]; then
            printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
              "$SERVER_USER@$SERVER_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          fi

      - name: Pull images and start containers
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_OWNER: ${{ needs.build_and_push_images.outputs.ghcr_owner }}
          IMAGE_TAG: ${{ needs.build_and_push_images.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && GHCR_OWNER='$GHCR_OWNER' IMAGE_TAG='$IMAGE_TAG' sh scripts/deploy.sh"
